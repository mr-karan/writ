name: Feature request
description: Ask for something Writ does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check docs/status.md first: what is known to be missing is listed there.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you would like Writ to solve it. Commands, config, or output help.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, or how another tool handles it.

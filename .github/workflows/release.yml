name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build and sign
        env:
          TAG: ${{ github.ref_name }}
          MINISIGN_KEY: ${{ secrets.WRIT_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.WRIT_MINISIGN_PASSWORD }}
        run: |
          [[ -n "$MINISIGN_KEY" ]] || { echo "::error::the secret WRIT_MINISIGN_KEY is empty"; exit 1; }
          key="$RUNNER_TEMP/writ.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_KEY" >"$key")
          printf '%s\n' "$MINISIGN_PASSWORD" | nix develop --command release/build.sh --version "$TAG" --sign-key "$key" --out dist
      - name: Install from dist and check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="$(mktemp -d)"
          nix develop --command sh dist/install.sh --from dist --dir "$bin"
          got="$("$bin/writ" version)"
          [[ "$got" == "writ $TAG" ]] || { echo "::error::the installed writ reports '$got', want 'writ $TAG'"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${pre[@]}" dist/*

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Push the images and their manifest list
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            nix shell --inputs-from . nixpkgs#skopeo --command skopeo copy \
              --authfile "$HOME/.docker/config.json" \
              "docker-archive:dist/writ-image-linux-$arch.tar.gz" "docker://$image:$version-$arch"
          done
          docker buildx imagetools create --tag "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version"

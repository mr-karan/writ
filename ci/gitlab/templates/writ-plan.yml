# GitLab CI/CD component: plan one Writ stack in one environment in each
# merge request with writ serve. The job sends no source: it names the
# pipeline's commit, which writ serve fetches from the project with its
# read-only token, so the job needs no checkout. A sketch: no GitLab
# pipeline has run it. See ci/gitlab/README.md for what is not verified.
spec:
  inputs:
    server:
      description: The URL of writ serve. It is also the audience of the job's token.
    env:
      description: The Writ environment to plan in.
    stack:
      description: The stack's name on writ serve, as writ repo show lists it.
    image:
      description: An image whose PATH holds the writ binary.
    stage:
      description: The stage of the plan job.
      default: writ-plan
---
"writ-plan-$[[ inputs.stack ]]-$[[ inputs.env ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  id_tokens:
    WRIT_ID_TOKEN:
      aud: $[[ inputs.server ]]
  variables:
    GIT_STRATEGY: none
    WRIT_SERVER: $[[ inputs.server ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # writ serve takes the project and the commit from the job's token,
    # and refuses a commit other than the token's.
    - >-
      writ plan --remote
      --env "$[[ inputs.env ]]"
      --stack "$[[ inputs.stack ]]"
      --commit "$CI_COMMIT_SHA"
      --hint-merge-request "$CI_MERGE_REQUEST_IID"
